name: Changelog draft

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master
    paths:
      - '**'
      - '!**.md'
      - '!.github/**'
      - '.github/workflows/changelog.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    name: Draft Unreleased section
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Generate Unreleased draft from commits since the last tag
        run: git-cliff --unreleased --strip all -o /tmp/unreleased.md

      - name: Update CHANGELOG.md's Unreleased section
        run: python3 .github/runner-files/update-unreleased-changelog.py CHANGELOG.md /tmp/unreleased.md

      # This is a draft, not a finished changelog entry: commit messages read like commit
      # messages, not user-facing release notes. Open a PR (mirroring how Weblate's translation
      # push-back works, see CONTRIBUTING.md) instead of committing straight to master, so the
      # wording gets a human editing pass before it ships in a release.
      - name: Open PR with the draft
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'docs: draft Unreleased changelog section'
          title: 'docs: draft Unreleased changelog section'
          body: |
            Auto-drafted from commits since the last tag using [git-cliff](https://github.com/orhun/git-cliff).

            This is a starting point, not a finished changelog entry - reword it to match the rest
            of CHANGELOG.md's user-facing tone before merging.
          branch: changelog/unreleased-draft
          delete-branch: true
          add-paths: CHANGELOG.md
